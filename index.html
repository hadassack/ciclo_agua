<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K Water Zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="water-drop-fx" id="dropFx"></div>

  <div class="container">
    <header>
      <h1 class="y2k-title">SPLASH_ZONE.EXE</h1>
      <p class="subtitle">Aesthetic Y2K & Kidcore Cyber Oasis</p>
    </header>

    <main>
      <div class="bubble-card">
        <div class="droplet-icon">💧</div>
        <h2>Nível de Hidratação</h2>
        <div class="counter" id="waterCounter">0%</div>
        
        <div class="button-group">
          <button class="y2k-btn" id="btnDrink">Beber Água 💦</button>
          <button class="y2k-btn alt" id="btnReset">Resetar 🔄</button>
        </div>
      </div>
    </main>

    <div class="bubbles-container" id="bubblesBg"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
